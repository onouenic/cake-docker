<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /opt/sites/comunic/www/app/webroot

    <Directory />
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    <Directory /var/www>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Order Allow,Deny
        Allow From all
    </Directory>

    ServerName localhost
    DocumentRoot /opt/sites/comunic/www/app/webroot

    <Directory /opt/sites/comunic/www/app/webroot>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
